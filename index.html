<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050507;color:#e8e0d0;font-family:Georgia,'Times New Roman',serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));z-index:20;text-align:center}
.scr.on{display:flex}
#title{background:radial-gradient(ellipse at center,rgba(0,0,0,.35) 0%,rgba(0,0,0,.78) 80%)}
h1{font-size:clamp(40px,13vw,86px);font-weight:900;letter-spacing:.04em;line-height:.92;color:#b3141a;text-transform:uppercase;text-shadow:0 0 18px rgba(200,20,20,.55),0 3px 0 #3a0508,0 6px 14px #000;font-family:Impact,'Arial Black',Georgia,serif}
h1 span{display:block;font-size:.42em;letter-spacing:.34em;color:#c9c0ae;text-shadow:0 2px 8px #000;font-family:Georgia,serif;font-weight:400;margin-bottom:.15em}
.drips{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);height:34px;margin:-2px 0 6px;overflow:hidden}
.drips i{display:block;width:6px;background:linear-gradient(#a3101a,#600);border-radius:0 0 6px 6px;animation:drip 4.2s ease-in infinite}
.drips i:nth-child(2n){animation-duration:5.6s;width:5px}.drips i:nth-child(3n){animation-duration:3.7s;animation-delay:.9s}.drips i:nth-child(5n){animation-delay:2s}
@keyframes drip{0%{height:3px}60%{height:24px}100%{height:3px}}
.tag{color:#9d927f;font-size:14px;letter-spacing:.2em;margin:4px 0 14px;text-transform:uppercase}
.btn{display:block;min-width:220px;font:700 19px Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#e8dfcc;background:linear-gradient(#2a0d0f,#14080a);border:1.5px solid #7a1c20;border-radius:4px;padding:12px 26px;margin:6px auto;cursor:pointer;box-shadow:0 0 14px rgba(150,20,20,.35),inset 0 0 12px rgba(0,0,0,.6);touch-action:manipulation}
.btn:active,.btn:hover{background:linear-gradient(#4a1417,#240c0e);color:#fff}
.btn.sm{font-size:14px;min-width:150px;padding:8px 16px;border-color:#4a3a30;box-shadow:none}
.btn.hide{display:none}
#bVR{border-color:#2a8a5a;color:#9dffc4;box-shadow:0 0 14px rgba(40,200,120,.3)}
.help{max-width:520px;color:#9a8f7c;font-size:12.5px;line-height:1.5;margin-top:10px}
.help b{color:#d6cbb4;font-weight:600}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#stat{color:#8a7f6c;font-size:12px;margin-top:6px;min-height:14px}
#settings,#pause,#over,#win{background:rgba(2,2,4,.88)}
#over h2,#win h2,#pause h2,#settings h2{font-size:clamp(30px,8vw,54px);color:#b3141a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 14px rgba(180,20,20,.5)}
#win h2{color:#cfc6b0}
.sl{display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(340px,92vw);margin:5px 0;font-size:15px;color:#cbbfa8}
.sl .btn{min-width:130px;margin:0;padding:8px 10px;font-size:14px}
#touch{position:fixed;inset:0;z-index:10;display:none;touch-action:none}
body.play.touch #touch{display:block}
.tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px Georgia,serif;letter-spacing:.08em;color:#e9e0cc;background:rgba(30,12,12,.5);border:2px solid rgba(190,60,50,.7);box-shadow:0 0 10px rgba(120,10,10,.4);touch-action:none;user-select:none}
.tb.on{background:rgba(160,30,30,.7);transform:scale(.94)}
.tb.fire{width:84px;height:84px;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));font-size:16px;border-color:#e0453a}
.tb.pump{width:58px;height:58px;right:calc(116px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom))}
.tb.reload{width:54px;height:54px;right:calc(22px + env(safe-area-inset-right));bottom:calc(122px + env(safe-area-inset-bottom))}
.tb.knife{width:54px;height:54px;right:calc(98px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom))}
.tb.use{width:54px;height:54px;right:calc(178px + env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));border-color:rgba(70,255,134,.8);color:#aaffcc}
.tb.shove{width:46px;height:46px;right:calc(26px + env(safe-area-inset-right));bottom:calc(190px + env(safe-area-inset-bottom));font-size:11px}
.tb.swap{width:46px;height:46px;right:calc(88px + env(safe-area-inset-right));bottom:calc(176px + env(safe-area-inset-bottom));font-size:11px}
#pauseBtn{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(200,190,170,.5);background:rgba(0,0,0,.4);color:#ddd;font-size:15px;display:none;touch-action:manipulation}
body.play #pauseBtn{display:block}
#stk{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(220,210,190,.35);background:rgba(0,0,0,.18);display:none;pointer-events:none}
#stk.on{display:block}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(220,210,190,.35);border:2px solid rgba(240,230,210,.6);transform:translate(-50%,-50%)}
#stkHint{position:absolute;left:calc(46px + env(safe-area-inset-left));bottom:calc(42px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:2px dashed rgba(220,210,190,.22);pointer-events:none}
#ret{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(240,230,210,.7);box-shadow:0 0 0 1px rgba(0,0,0,.6);z-index:9;display:none;pointer-events:none}
body.play:not(.vr) #ret{display:block}
#ret.hit{background:#ff5040;transform:scale(1.8)}#ret.head{background:#ffd040;transform:scale(2.4)}
#toast{position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:11;color:#e8dfc8;font-size:16px;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:4px;border:1px solid rgba(140,40,40,.6);display:none;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{display:block}
body.vr #toast{display:none!important}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(190,0,0,.85));transition:opacity .12s}
body.vr #hurt{display:none}
#flash{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;background:#9fb8ff}
#loading{position:fixed;inset:0;z-index:50;background:#050507;display:flex;align-items:center;justify-content:center;color:#7a6a5a;letter-spacing:.3em;font-size:14px;text-transform:uppercase}
@media (orientation:landscape) and (max-height:520px){h1{font-size:clamp(34px,10vh,56px)}.tag{margin:2px 0 6px}.btn{padding:7px 20px;margin:4px;font-size:16px;min-width:190px}.help{font-size:11px;margin-top:4px;line-height:1.35}.drips{height:18px}.tb.fire{width:78px;height:78px;bottom:calc(20px + env(safe-area-inset-bottom))}.tb.pump{bottom:calc(26px + env(safe-area-inset-bottom));right:calc(110px + env(safe-area-inset-right))}.tb.reload{bottom:calc(108px + env(safe-area-inset-bottom));right:calc(20px + env(safe-area-inset-right))}.tb.knife{bottom:calc(96px + env(safe-area-inset-bottom));right:calc(88px + env(safe-area-inset-right))}.tb.use{bottom:calc(60px + env(safe-area-inset-bottom));right:calc(168px + env(safe-area-inset-right))}.tb.shove{bottom:calc(172px + env(safe-area-inset-bottom));right:calc(26px + env(safe-area-inset-right))}.tb.swap{bottom:calc(166px + env(safe-area-inset-bottom));right:calc(84px + env(safe-area-inset-right))}}
@media (max-height:380px){.tb.shove,.tb.swap{display:none}}
