<p>Zombie Hell is now <b>Living Corpses</b>.<br><a id="go" href="https://optimusgrok.github.io/living-corpses/test/">Continue to https://optimusgrok.github.io/living-corpses/test/</a></p>
<script>
(function () {
  var dest = 'https://optimusgrok.github.io/living-corpses/test/' + location.search + location.hash;
  document.getElementById('go').href = dest;
  var go = function () { location.replace(dest); };
  var jobs = [];
  try { if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
  try { if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
  var done = false, fin = function () { if (!done) { done = true; go(); } };
  Promise.all(jobs).then(fin, fin); setTimeout(fin, 1500);
})();
</script>
